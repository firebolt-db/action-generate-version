name: Generate Version
description: Automatic version generation based on semver versioning and conventional commit messages

inputs:
  changes:
    description: 'Newline-separated list of commit messages since last release'
    required: true
  old-tag:
    description: 'Previous semantic version tag (e.g., 1.0.1)'
    required: true
  prerelease-tag:
    description: 'Tag for pre-release (e.g., alpha, beta, rc). Leave empty for stable release.'
    required: false
    default: ''
  major-release:
    description: 'Trigger a major release. Any non-empty value indicates major release.'
    required: false
    default: ''

outputs:
  new-tag:
    description: 'Generated semantic version tag'
    value: ${{ steps.generate_version.outputs.new_tag }}

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install semver
      shell: bash
        
    - name: Generate version tag
      id: generate_version
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHANGES: ${{ inputs.changes }}
        OLD_TAG: ${{ inputs.old-tag }}
        PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
        MAJOR_RELEASE: ${{ inputs.major-release }}
      run: |
        NEW_TAG=$(python3 "$ACTION_PATH/scripts/generate_version_tag.py" --prerelease_tag="$PRERELEASE_TAG" --major_release="$MAJOR_RELEASE" -- "$CHANGES" "$OLD_TAG")
        printf 'new_tag=%s\n' "$NEW_TAG" >> "$GITHUB_OUTPUT"
      shell: bash
